<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FITROOM | 상의·바지·신발 패션 스토어</title>
  <meta name="description" content="FITROOM — 상의·바지·신발을 한곳에서. 카테고리별 인기 랭킹과 신상품, 5만원 이상 무료배송. 토스페이먼츠 테스트 결제 환경의 패션 쇼핑몰 데모입니다." />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FITROOM | 상의·바지·신발 패션 스토어" />
  <meta property="og:description" content="FITROOM — 상의·바지·신발을 한곳에서. 카테고리별 인기 랭킹과 신상품, 5만원 이상 무료배송. 토스페이먼츠 테스트 결제 환경의 패션 쇼핑몰 데모입니다." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <header id="site-header"></header>

  <main>
    <h1 class="sr-only">FITROOM 패션 스토어 — 상의, 바지, 신발</h1>
    <div class="inner"><div class="banners" id="banners" hidden></div></div>
    <section class="hero" id="hero"></section>
    <noscript><p class="inner">FITROOM은 상의·바지·신발을 판매하는 패션 스토어입니다. <a href="tops.html">상의</a> · <a href="pants.html">바지</a> · <a href="shoes.html">신발</a> · <a href="faq.html">FAQ</a> · <a href="notice.html">공지</a></p></noscript>

    <div class="inner">
      <nav class="cat-shortcut">
        <a href="tops.html">상의 <span>TOPS</span></a>
        <a href="pants.html">바지 <span>PANTS</span></a>
        <a href="shoes.html">신발 <span>SHOES</span></a>
      </nav>

      <div id="home-sections"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/seo.js"></script>
  <script>
    onReady(() => {
      const heroes = [
        { id: "t03", small: "COVERSTUDIO 단독", title: "가을 아우터<br>최대 30% 할인" },
        { id: "p01", small: "DENIMLAB 신상", title: "와이드 데님<br>컬렉션" },
        { id: "s01", small: "STRIDE 랭킹 1위", title: "매일 신는<br>화이트 스니커즈" },
      ];
      // 관리자가 히어로 상품을 숨기거나 지우면 해당 슬라이드는 건너뛴다.
      document.getElementById("hero").innerHTML = heroes
        .filter((h) => findProduct(h.id))
        .map((h) => {
          const p = findProduct(h.id);
          return `<a class="hero-slide" href="product.html?id=${p.id}">${productImage(p, 1)}
            <div class="hero-copy"><small>${h.small}</small><strong>${h.title}</strong></div></a>`;
        })
        .join("");

      // 노출 중인 배너(RLS가 기간/활성 여부를 걸러 준다). 링크는 같은 사이트 상대경로와 http(s)만 허용.
      if (sb) {
        sb.from("banners").select("*").order("sort_order").order("id").then(({ data }) => {
          const list = (data || []).filter((b) => b.is_active && (!b.starts_at || new Date(b.starts_at) <= new Date()) && (!b.ends_at || new Date(b.ends_at) >= new Date()));
          if (!list.length) return;
          const el = document.getElementById("banners");
          el.hidden = false;
          el.innerHTML = list.map((b) => {
            const ok = /^(https?:\/\/|[\w./?=&#-]+$)/.test(b.link_url);
            const img = `<img src="${SUPABASE_URL}/storage/v1/object/public/banners/${b.image_path.split("/").map(encodeURIComponent).join("/")}" alt="${escapeHtml(b.title)}" loading="lazy" />`;
            return ok && b.link_url ? `<a href="${escapeHtml(b.link_url)}">${img}</a>` : `<a>${img}</a>`;
          }).join("");
        });
      }

      document.getElementById("home-sections").innerHTML = Object.entries(CATEGORIES)
        .map(([key, c]) => {
          const top = PRODUCTS.filter((p) => p.cat === key).sort((a, b) => b.likes - a.likes).slice(0, 4);
          return `<section class="section">
            <div class="section-head"><h2>${c.name} 랭킹</h2><a href="${c.page}">전체보기 ›</a></div>
            <ul class="grid">${top.map((p, i) => productCard(p, i + 1)).join("")}</ul>
          </section>`;
        })
        .join("");
    });
  </script>
</body>
</html>
