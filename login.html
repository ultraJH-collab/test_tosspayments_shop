<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | FITROOM</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header id="site-header"></header>

  <main class="inner">
    <div class="auth">
      <div class="auth-tabs" id="auth-tabs">
        <button type="button" data-tab="login" class="on">로그인</button>
        <button type="button" data-tab="signup">회원가입</button>
      </div>

      <form class="auth-form" id="form-login" novalidate>
        <label>이메일<input name="email" type="email" autocomplete="email" required /></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="pay-error" data-error></p>
        <button type="submit" class="btn btn-black">로그인</button>
        <button type="button" class="btn btn-line" id="btn-google">Google로 계속하기</button>
        <button type="button" class="link-btn" id="btn-forgot">비밀번호를 잊으셨나요?</button>
      </form>

      <form class="auth-form hidden" id="form-forgot" novalidate>
        <p class="muted">가입한 이메일로 비밀번호 재설정 링크를 보내드려요.</p>
        <label>이메일<input name="email" type="email" autocomplete="email" required /></label>
        <p class="pay-error" data-error></p>
        <button type="submit" class="btn btn-black">재설정 메일 보내기</button>
        <button type="button" class="link-btn" id="btn-back-login">로그인으로 돌아가기</button>
      </form>

      <form class="auth-form hidden" id="form-signup" novalidate>
        <label>이메일<input name="email" type="email" autocomplete="email" required /></label>
        <label><span>비밀번호 <small>(6자 이상)</small></span><input name="password" type="password" autocomplete="new-password" minlength="6" required /></label>
        <label>비밀번호 확인<input name="password2" type="password" autocomplete="new-password" required /></label>
        <label>이름<input name="name" autocomplete="name" required /></label>
        <label><span>휴대폰 <small>(선택)</small></span><input name="phone" inputmode="numeric" autocomplete="tel" placeholder="숫자만 입력" /></label>
        <p class="pay-error" data-error></p>
        <button type="submit" class="btn btn-black">회원가입</button>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/seo.js"></script>
  <script>
    onReady(() => {
      // 다른 사이트로 보내지 않도록 같은 폴더의 .html 경로만 허용한다.
      const raw = qs("next") || "index.html";
      const next = /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(raw) ? raw : "index.html";
      if (Auth.user) return location.replace(next);

      const tabs = document.getElementById("auth-tabs");
      const forms = { login: document.getElementById("form-login"), signup: document.getElementById("form-signup"), forgot: document.getElementById("form-forgot") };
      function showTab(tab) {
        tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
        Object.entries(forms).forEach(([k, f]) => f.classList.toggle("hidden", k !== tab));
        document.title = `${tab === "login" ? "로그인" : "회원가입"} | FITROOM`;
      }
      tabs.addEventListener("click", (e) => e.target.dataset.tab && showTab(e.target.dataset.tab));
      showTab(qs("tab") === "signup" ? "signup" : "login");

      const errorOf = (form) => form.querySelector("[data-error]");
      const busy = (form, on) => (form.querySelector("button[type=submit]").disabled = on);
      const KO_ERRORS = {
        "Invalid login credentials": "이메일 또는 비밀번호가 올바르지 않습니다.",
        "User already registered": "이미 가입된 이메일입니다.",
      };
      const ko = (err) => KO_ERRORS[err.message] || err.message;

      // 구글 로그인: 같은 이메일로 가입한 계정이 있으면 Supabase가 자동 연결한다. 돌아올 때 next 를 유지한다.
      const base = location.origin + location.pathname.replace(/[^/]*$/, "");
      document.getElementById("btn-google").onclick = async () => {
        // provider 가 꺼져 있으면 JSON 오류 페이지로 이동해 버리므로, 이동 전에 설정을 확인한다.
        const settings = await fetch(`${SUPABASE_URL}/auth/v1/settings`, { headers: { apikey: SUPABASE_KEY } }).then((r) => r.json()).catch(() => null);
        if (settings && settings.external && !settings.external.google) {
          return (errorOf(forms.login).textContent = "Google 로그인이 아직 설정되지 않았습니다. (Supabase 대시보드 > Authentication > Providers 에서 Google을 활성화해야 합니다)");
        }
        const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: base + "login.html?next=" + encodeURIComponent(next) } });
        if (error) errorOf(forms.login).textContent = /not enabled|Unsupported provider/i.test(error.message) ? "Google 로그인이 아직 설정되지 않았습니다. (Supabase 대시보드에서 Google provider를 활성화해야 합니다)" : error.message;
      };
      document.getElementById("btn-forgot").onclick = () => {
        Object.entries(forms).forEach(([k, f]) => f.classList.toggle("hidden", k !== "forgot"));
        tabs.classList.add("hidden");
      };
      document.getElementById("btn-back-login").onclick = () => {
        tabs.classList.remove("hidden");
        showTab("login");
      };
      forms.forgot.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.currentTarget;
        const err = errorOf(f);
        const email = f.email.value.trim();
        if (!/^\S+@\S+\.\S+$/.test(email)) return (err.textContent = "이메일을 확인해 주세요.");
        busy(f, true);
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: base + "reset-password.html" });
        busy(f, false);
        err.style.color = error ? "" : "inherit";
        err.textContent = error ? error.message : "재설정 링크를 보냈습니다. 메일함을 확인해 주세요.";
      });

      forms.login.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.currentTarget;
        const err = errorOf(f);
        err.textContent = "";
        const email = f.email.value.trim();
        if (!email || !f.password.value) return (err.textContent = "이메일과 비밀번호를 입력해 주세요.");
        busy(f, true);
        const { error } = await sb.auth.signInWithPassword({ email, password: f.password.value });
        if (error) {
          busy(f, false);
          return (err.textContent = ko(error));
        }
        await loadSession();
        if (!Auth.user) {
          busy(f, false);
          return (err.textContent = "이용이 정지된 계정입니다.");
        }
        location.replace(next);
      });

      forms.signup.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.currentTarget;
        const err = errorOf(f);
        err.textContent = "";
        const email = f.email.value.trim();
        const name = f.name.value.trim();
        const phone = f.phone.value.replace(/\D/g, "");
        if (!/^\S+@\S+\.\S+$/.test(email)) return (err.textContent = "이메일을 확인해 주세요.");
        if (f.password.value.length < 6) return (err.textContent = "비밀번호는 6자 이상이어야 합니다.");
        if (f.password.value !== f.password2.value) return (err.textContent = "비밀번호가 일치하지 않습니다.");
        if (!name) return (err.textContent = "이름을 입력해 주세요.");
        if (phone && !/^01\d{8,9}$/.test(phone)) return (err.textContent = "휴대폰 번호를 확인해 주세요.");

        busy(f, true);
        let { data, error } = await sb.auth.signUp({
          email,
          password: f.password.value,
          options: { data: { name, phone } },
        });
        // 이메일 인증은 사용하지 않는다(DB 트리거가 가입 즉시 인증 처리). 세션이 없으면 바로 로그인한다.
        if (!error && !data.session) {
          ({ data, error } = await sb.auth.signInWithPassword({ email, password: f.password.value }));
          if (error) error = { message: "User already registered" };
        }
        busy(f, false);
        if (error) return (err.textContent = ko(error));
        await loadSession();
        toast("가입을 환영합니다!");
        return location.replace(next);
      });
    });
  </script>
</body>
</html>
