<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문 완료 | FITROOM</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="success">
  <header id="site-header"></header>

  <main class="inner">
    <div class="result" id="result"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/seo.js"></script>
  <script>
    onReady(async () => {
      const el = document.getElementById("result");
      const paymentKey = qs("paymentKey");
      const orderId = qs("orderId");
      const amount = Number(qs("amount"));
      const pending = storeGet(sessionStorage, "fr_pending_order", null);
      const fail = (msg) => {
        el.innerHTML = `
          <div class="result-icon fail">!</div>
          <h1>결제 정보를 확인할 수 없습니다</h1>
          <p>${escapeHtml(msg)}</p>
          <div class="result-actions"><a class="btn btn-line" href="cart.html">장바구니</a><a class="btn btn-black" href="index.html">홈으로</a></div>`;
      };

      // 금액 위변조 확인 1: 결제 요청 때 저장한 주문과 리다이렉트 파라미터 비교
      if (!paymentKey || !orderId || !pending || pending.orderId !== orderId || pending.amount !== amount) {
        return fail("주문 정보가 없거나 결제 금액이 일치하지 않습니다.");
      }
      // 금액 위변조 확인 2: 서버(Edge Function)가 DB 금액과 비교 → 토스 결제 승인 API 호출 → 결제완료로 기록
      el.innerHTML = `<div class="result-icon">…</div><h1>결제를 승인하는 중입니다</h1><p>잠시만 기다려 주세요.</p>`;
      const { data: order, error } = await sb.functions.invoke("confirm-payment", { body: { orderId, paymentKey, amount } });
      if (error) {
        let msg = error.message;
        try { msg = (await error.context.json()).error || msg; } catch (e) {}
        return fail(msg);
      }

      if (pending.mode === "cart") Cart.save([]);
      try { sessionStorage.removeItem("fr_buynow"); } catch (e) {}

      el.innerHTML = `
        <div class="result-icon">✓</div>
        <h1>주문이 완료되었습니다</h1>
        <p>토스페이먼츠 테스트 결제가 정상적으로 처리되었습니다.</p>
        <dl class="result-table">
          <div><dt>주문번호</dt><dd>${escapeHtml(order.order_id)}</dd></div>
          <div><dt>주문상품</dt><dd>${escapeHtml(order.order_name)}</dd></div>
          <div><dt>결제금액</dt><dd>${won(order.amount)}</dd></div>
          <div><dt>주문상태</dt><dd>${ORDER_STATUS[order.status] || order.status}</dd></div>
          <div><dt>paymentKey</dt><dd>${escapeHtml(paymentKey)}</dd></div>
        </dl>
        <div class="result-actions"><a class="btn btn-line" href="index.html">쇼핑 계속하기</a>${
          Auth.user
            ? `<a class="btn btn-black" href="mypage.html">주문내역 보기</a>`
            : `<a class="btn btn-black" href="login.html?tab=signup">회원가입</a>`
        }</div>
        `;
    });
  </script>
</body>
</html>
