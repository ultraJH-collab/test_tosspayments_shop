<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상품 상세 | FITROOM</title>
  <meta name="description" content="FITROOM 상품 상세. 가격, 사이즈별 재고, 후기, 상품 Q&A를 확인하고 바로 구매하세요. 5만원 이상 무료배송." />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="상품 상세 | FITROOM" />
  <meta property="og:description" content="FITROOM 상품 상세. 가격, 사이즈별 재고, 후기, 상품 Q&A를 확인하고 바로 구매하세요. 5만원 이상 무료배송." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page-detail>
  <header id="site-header"></header>

  <main class="inner" id="pd-root">
    <p class="breadcrumb" style="padding-top:20px"><a href="index.html">홈</a> › <a id="crumb-cat" href="#"></a></p>

    <section class="pd">
      <div class="gallery">
        <div class="thumbs" id="thumbs"></div>
        <div class="main-img" id="main-img"></div>
      </div>

      <div class="pd-info">
        <a href="#" class="pd-brand" id="pd-brand"></a>
        <h1 class="pd-name" id="pd-name"></h1>
        <p class="pd-review" id="pd-review"></p>

        <div class="pd-price">
          <del id="pd-origin"></del>
          <div class="row"><span class="rate" id="pd-rate"></span><span class="sale" id="pd-sale"></span></div>
        </div>

        <dl class="pd-dl">
          <dt>적립금</dt><dd>최대 <b id="pd-point"></b> 적립</dd>
          <dt>배송</dt><dd>5만원 이상 무료배송 · 오늘 출발 (평일 14시 이전 주문)</dd>
          <dt>결제혜택</dt><dd>토스페이 첫 결제 시 즉시 할인 (테스트)</dd>
        </dl>

        <div class="opt">
          <p class="opt-label">사이즈</p>
          <div class="sizes" id="sizes"></div>
        </div>
        <div class="opt">
          <p class="opt-label">수량</p>
          <div class="qty">
            <button type="button" id="qty-minus" aria-label="수량 감소">−</button>
            <input type="text" id="qty" value="1" inputmode="numeric" aria-label="수량" />
            <button type="button" id="qty-plus" aria-label="수량 증가">+</button>
          </div>
        </div>

        <div class="pd-total"><span>총 상품 금액</span><strong id="pd-total"></strong></div>

        <div class="pd-actions">
          <button type="button" class="btn btn-like" id="btn-like" aria-label="좋아요">♥</button>
          <button type="button" class="btn btn-line" id="btn-cart">장바구니</button>
          <button type="button" class="btn btn-black" id="btn-buy">구매하기</button>
        </div>
      </div>
    </section>

    <nav class="pd-tabs" id="pd-tabs">
      <a href="#sec-info" class="on">정보</a>
      <a href="#sec-size">사이즈</a>
      <a href="#sec-review">후기</a>
      <a href="#sec-qna">Q&A</a>
      <a href="#sec-related">추천</a>
    </nav>

    <section class="pd-section" id="sec-info">
      <h3>상품 정보</h3>
      <div class="detail-imgs" id="detail-imgs"></div>
      <p class="notice" style="max-width:640px;margin:20px auto 0" id="detail-text"></p>
    </section>

    <section class="pd-section" id="sec-size">
      <h3>사이즈 정보 <small style="font-size:12px;color:#a3a3a3;font-weight:500">(단위: cm)</small></h3>
      <table class="size-table" id="size-table"></table>
    </section>

    <section class="pd-section" id="sec-review">
      <h3>후기 <span id="review-count" style="color:#a3a3a3"></span></h3>
      <div id="reviews"></div>
    </section>

    <section class="pd-section" id="sec-qna">
      <h3>상품 Q&A <span id="qna-count" style="color:#a3a3a3"></span></h3>
      <div id="qna-form-box"></div>
      <div id="qna"></div>
    </section>

    <section class="pd-section" id="sec-related">
      <h3>이 카테고리의 다른 상품</h3>
      <ul class="grid" id="related"></ul>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/seo.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
