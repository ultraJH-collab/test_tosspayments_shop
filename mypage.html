<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마이페이지 | FITROOM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="mypage">
  <header id="site-header"></header>

  <main class="inner">
    <h1 class="page-title">마이페이지</h1>
    <nav class="my-tabs" id="my-tabs">
      <button type="button" data-tab="orders" class="on">주문 내역</button>
      <button type="button" data-tab="wish">찜한 상품</button>
      <button type="button" data-tab="address">배송지 관리</button>
      <button type="button" data-tab="profile">회원 정보</button>
    </nav>

    <section class="box my-panel" id="tab-orders">
      <div class="box-title">주문 내역 <span class="muted" id="order-count"></span></div>
      <div id="orders"></div>
    </section>

    <section class="box my-panel hidden" id="tab-wish">
      <div class="box-title">찜한 상품 <span class="muted" id="wish-count"></span></div>
      <ul class="grid" id="wish-grid"></ul>
    </section>

    <section class="box my-panel hidden" id="tab-address">
      <div class="box-title">배송지 관리 <span class="muted" id="addr-count"></span></div>
      <div id="addr-list"></div>
      <form class="form-grid" id="addr-form" style="margin-top:20px">
        <label for="a-label">배송지 이름</label><input id="a-label" placeholder="예: 집, 회사" />
        <label for="a-name">받는 분</label><input id="a-name" required />
        <label for="a-phone">휴대폰</label><input id="a-phone" inputmode="numeric" placeholder="숫자만 입력" required />
        <label for="a-zip">우편번호</label><input id="a-zip" required />
        <label for="a-addr1">기본 주소</label><input id="a-addr1" required />
        <label for="a-addr2">상세 주소</label><input id="a-addr2" />
        <span></span><label class="check"><input type="checkbox" id="a-default" /> 기본 배송지로 설정</label>
        <span></span><button type="submit" class="btn btn-black btn-sm">배송지 추가</button>
      </form>
    </section>

    <section class="my-panel hidden" id="tab-profile">
      <div class="box">
        <div class="box-title">회원 정보</div>
        <p class="pay-error" id="phone-nudge" hidden>연락 가능한 휴대폰 번호를 입력해 주세요.</p>
        <form class="form-grid" id="profile-form">
          <label>이메일</label><input id="m-email" disabled />
          <label for="m-name">이름</label><input id="m-name" autocomplete="name" />
          <label for="m-phone">휴대폰</label><input id="m-phone" inputmode="numeric" autocomplete="tel" placeholder="숫자만 입력" />
          <label>가입일</label><input id="m-joined" disabled />
          <span></span><button type="submit" class="btn btn-black btn-sm">정보 저장</button>
        </form>
      </div>
      <div class="box" style="margin-top:40px">
        <div class="box-title">비밀번호 변경</div>
        <form class="form-grid" id="pw-form">
          <label for="pw1">새 비밀번호</label><input id="pw1" type="password" minlength="6" autocomplete="new-password" />
          <label for="pw2">새 비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password" />
          <span></span><button type="submit" class="btn btn-black btn-sm">비밀번호 변경</button>
        </form>
      </div>
      <div class="box" style="margin-top:40px">
        <div class="box-title danger">회원 탈퇴</div>
        <p class="muted">탈퇴하면 계정과 찜·장바구니·배송지·작성한 후기가 삭제되며 되돌릴 수 없습니다. 주문 기록은 전자상거래법에 따라 5년간 보관 후 파기됩니다(주문자 이름·연락처는 마스킹 처리).</p>
        <button type="button" class="btn btn-line btn-sm danger" id="btn-withdraw">회원 탈퇴</button>
      </div>
    </section>
  </main>

  <dialog id="rv-dialog" class="dlg">
    <form id="rv-form" method="dialog" class="dlg-form">
      <h3 id="rv-title">후기 작성</h3>
      <div class="form-grid">
        <label for="rv-rating">별점</label>
        <select id="rv-rating"><option value="5">★★★★★ (5)</option><option value="4">★★★★☆ (4)</option><option value="3">★★★☆☆ (3)</option><option value="2">★★☆☆☆ (2)</option><option value="1">★☆☆☆☆ (1)</option></select>
        <label for="rv-body">내용</label><textarea id="rv-body" rows="5" maxlength="1000" placeholder="최대 1,000자"></textarea>
        <label for="rv-files">사진</label><input id="rv-files" type="file" accept="image/jpeg,image/png,image/webp" multiple />
      </div>
      <p class="muted">사진은 최대 3장, 장당 5MB 이하(jpg/png/webp)</p>
      <p class="pay-error" id="rv-error"></p>
      <div class="dlg-foot">
        <button type="button" class="btn btn-line btn-sm" data-close>취소</button>
        <button type="submit" class="btn btn-black btn-sm" id="rv-save">등록</button>
      </div>
    </form>
  </dialog>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script>
    onReady(async () => {
      if (!Auth.user) return location.replace(loginUrl());
      const $ = (id) => document.getElementById(id);
      const fail = async (error) => {
        let msg = error.message;
        try { msg = (await error.context.json()).error || msg; } catch (e) {}
        toast(msg);
      };

      /* ---------- 탭 ---------- */
      const TABS = ["orders", "wish", "address", "profile"];
      function showTab(tab) {
        if (!TABS.includes(tab)) tab = "orders";
        document.querySelectorAll("#my-tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
        TABS.forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== tab));
        history.replaceState(null, "", "#" + tab);
      }
      $("my-tabs").addEventListener("click", (e) => e.target.dataset.tab && showTab(e.target.dataset.tab));
      showTab(location.hash.slice(1));

      /* ---------- 회원 정보 ---------- */
      const p = Auth.profile || {};
      $("m-email").value = Auth.user.email;
      $("m-name").value = p.name || "";
      $("m-phone").value = p.phone || "";
      $("m-joined").value = new Date(Auth.user.created_at).toLocaleDateString("ko-KR");
      $("phone-nudge").hidden = !!p.phone; // 구글 로그인 등으로 가입해 번호가 없는 경우 입력 유도

      $("profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("m-name").value.trim();
        const phone = $("m-phone").value.replace(/\D/g, "");
        if (!name) return toast("이름을 입력해 주세요.");
        if (phone && !/^01\d{8,9}$/.test(phone)) return toast("휴대폰 번호를 확인해 주세요.");
        const { data, error } = await sb.from("profiles").update({ name, phone }).eq("id", Auth.user.id).select().single();
        if (error) return toast(error.message);
        Auth.profile = data;
        $("phone-nudge").hidden = !!data.phone;
        renderHeader("mypage");
        toast("회원 정보를 저장했어요.");
      });

      $("pw-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if ($("pw1").value.length < 6) return toast("비밀번호는 6자 이상이어야 합니다.");
        if ($("pw1").value !== $("pw2").value) return toast("비밀번호가 일치하지 않습니다.");
        const { error } = await sb.auth.updateUser({ password: $("pw1").value });
        if (error) return toast(error.message);
        e.target.reset();
        toast("비밀번호를 변경했어요.");
      });

      $("btn-withdraw").onclick = async () => {
        if (!confirm("정말 탈퇴할까요? 계정과 찜·장바구니·배송지·후기가 삭제되며 되돌릴 수 없습니다.")) return;
        const { error } = await sb.functions.invoke("delete-account");
        if (error) return fail(error);
        try { localStorage.removeItem("fr_cart"); } catch (e) {}
        await sb.auth.signOut().catch(() => {});
        alert("탈퇴가 완료되었습니다.");
        location.href = "index.html";
      };

      /* ---------- 찜한 상품 ---------- */
      async function renderWish() {
        const { data } = await sb.from("wishlists").select("product_id, created_at").order("created_at", { ascending: false });
        const rows = data || [];
        $("wish-count").textContent = `${rows.length}개`;
        // 판매중지/삭제된 상품은 목록에서 제외하고 안내한다.
        const live = rows.map((r) => findProduct(r.product_id)).filter(Boolean);
        const gone = rows.length - live.length;
        $("wish-grid").innerHTML = live.length
          ? live.map((x) => productCard(x)).join("") + (gone ? `<li class="muted" style="grid-column:1/-1">판매가 중지된 상품 ${gone}개는 표시되지 않습니다.</li>` : "")
          : `<li class="empty" style="grid-column:1/-1"><p>찜한 상품이 없습니다.</p><a class="btn btn-black" href="index.html">쇼핑하러 가기</a></li>`;
      }

      /* ---------- 배송지 ---------- */
      async function renderAddresses() {
        const { data } = await sb.from("addresses").select("*").order("is_default", { ascending: false }).order("id");
        const list = data || [];
        $("addr-count").textContent = `${list.length}/10`;
        $("addr-list").innerHTML = list.length
          ? list.map((a) => `
            <div class="addr-card">
              <div>
                <b>${escapeHtml(a.label || a.recipient)}</b>${a.is_default ? '<span class="pill">기본</span>' : ""}<br>
                ${escapeHtml(a.recipient)} · ${escapeHtml(a.phone)}<br>
                <span class="muted">(${escapeHtml(a.zip)}) ${escapeHtml(a.addr1)} ${escapeHtml(a.addr2)}</span>
              </div>
              <div>
                ${a.is_default ? "" : `<button type="button" class="btn-cancel-order" data-addr-default="${a.id}">기본으로</button>`}
                <button type="button" class="btn-cancel-order" data-addr-del="${a.id}">삭제</button>
              </div>
            </div>`).join("")
          : `<p class="muted">저장된 배송지가 없습니다.</p>`;
      }
      $("addr-list").addEventListener("click", async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const res = b.dataset.addrDel
          ? await sb.from("addresses").delete().eq("id", b.dataset.addrDel)
          : await sb.from("addresses").update({ is_default: true }).eq("id", b.dataset.addrDefault);
        if (res.error) return toast(res.error.message);
        renderAddresses();
      });
      $("addr-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const phone = $("a-phone").value.replace(/\D/g, "");
        if (!/^01\d{8,9}$/.test(phone)) return toast("휴대폰 번호를 확인해 주세요.");
        const { error } = await sb.from("addresses").insert({
          user_id: Auth.user.id, label: $("a-label").value.trim(), recipient: $("a-name").value.trim(), phone,
          zip: $("a-zip").value.trim(), addr1: $("a-addr1").value.trim(), addr2: $("a-addr2").value.trim(), is_default: $("a-default").checked,
        });
        if (error) return toast(error.message);
        e.target.reset();
        renderAddresses();
        toast("배송지를 추가했어요.");
      });

      /* ---------- 주문 내역 / 배송 타임라인 / 취소 / 후기 ---------- */
      const fmt = (s) => new Date(s).toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "short" });
      let myReviews = {};
      function timeline(o) {
        if (!["paid", "shipping", "delivered"].includes(o.status)) return "";
        const steps = [["결제완료", o.paid_at], ["배송중", o.shipped_at], ["배송완료", o.delivered_at]];
        const idx = ["paid", "shipping", "delivered"].indexOf(o.status);
        const url = o.tracking_no ? trackingUrl(o.courier, o.tracking_no) : null;
        return `<ol class="timeline">${steps.map(([label, at], i) => `<li class="${i <= idx ? "on" : ""}"><b>${label}</b><small>${at && i <= idx ? fmt(at) : ""}</small></li>`).join("")}</ol>${
          o.tracking_no ? `<div class="oc-foot">${escapeHtml(o.courier || "")} 운송장 <b>${escapeHtml(o.tracking_no)}</b>${url ? ` · <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">배송 조회 ›</a>` : ""}</div>` : ""
        }`;
      }
      function reviewBtn(o, i) {
        if (o.status !== "delivered") return "";
        return myReviews[i.id]
          ? `<span class="muted">후기 작성 완료</span>`
          : `<button type="button" class="btn-cancel-order" data-review="${i.id}" data-product="${escapeHtml(i.product_id)}">후기 작성</button>`;
      }
      async function renderOrders() {
        const [{ data: orders, error }, { data: rv }] = await Promise.all([
          sb.from("orders").select("*, order_items(*)").eq("user_id", Auth.user.id).order("created_at", { ascending: false }),
          sb.from("reviews").select("order_item_id").eq("user_id", Auth.user.id),
        ]);
        if (error) return ($("orders").innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`);
        myReviews = Object.fromEntries((rv || []).map((r) => [r.order_item_id, true]));
        $("order-count").textContent = `${orders.length}건`;
        $("orders").innerHTML = orders.length
          ? orders.map((o) => `
          <div class="order-card">
            <div class="oc-head">
              <span>${new Date(o.created_at).toLocaleString("ko-KR")}</span>
              <span class="oc-id">${escapeHtml(o.id)}</span>
              <span class="status status-${o.status}">${ORDER_STATUS[o.status]}</span>
            </div>
            ${o.order_items.map((i) => {
              const prod = findProduct(i.product_id);
              return `
              <div class="line-item">
                ${prod ? `<a class="li-img" href="product.html?id=${prod.id}">${productImage(prod)}</a>` : `<div class="li-img"></div>`}
                <div>
                  <p class="li-brand">${escapeHtml(i.brand)}</p>
                  <p class="li-name">${escapeHtml(i.product_name)}</p>
                  <p class="li-opt">옵션: ${escapeHtml(i.size)} / 수량: ${i.qty}개 ${reviewBtn(o, i)}</p>
                </div>
                <div class="li-price"><b>${won(i.line_total)}</b></div>
              </div>`;
            }).join("")}
            ${timeline(o)}
            ${o.status === "canceled" ? `<div class="oc-foot muted">취소 사유: ${escapeHtml(o.cancel_reason || "-")}</div>` : ""}
            <div class="oc-foot">${o.status === "paid" ? `<button type="button" class="btn-cancel-order" data-cancel="${escapeHtml(o.id)}">주문 취소</button>` : o.status === "shipping" || o.status === "delivered" ? '<span class="muted">배송 이후 취소는 고객센터로 문의해 주세요.</span>' : ""}</div>
            <div class="oc-foot">${o.discount ? `쿠폰 할인 -${won(o.discount)} · ` : ""}배송비 ${o.shipping ? won(o.shipping) : "무료"} · 결제금액 <b>${won(o.amount)}</b></div>
          </div>`).join("")
          : `<div class="empty"><p>주문 내역이 없습니다.</p><a class="btn btn-black" href="index.html">쇼핑하러 가기</a></div>`;
      }

      $("orders").addEventListener("click", async (e) => {
        const rb = e.target.closest("[data-review]");
        if (rb) return openReview(Number(rb.dataset.review), rb.dataset.product);
        const btn = e.target.closest("[data-cancel]");
        if (!btn || !confirm("이 주문을 취소할까요? 결제 금액이 전액 환불됩니다.")) return;
        btn.disabled = true;
        const { error } = await sb.functions.invoke("cancel-payment", { body: { orderId: btn.dataset.cancel, reason: "고객 요청" } });
        if (error) {
          btn.disabled = false;
          return fail(error);
        }
        toast("주문을 취소했습니다.");
        setTimeout(() => location.reload(), 600);
      });

      /* 후기 작성 */
      const dlg = $("rv-dialog");
      let reviewTarget = null;
      function openReview(orderItemId, productId) {
        reviewTarget = { orderItemId, productId };
        $("rv-form").reset();
        $("rv-error").textContent = "";
        dlg.showModal();
      }
      dlg.addEventListener("click", (e) => (e.target.hasAttribute("data-close") || e.target === dlg) && dlg.close());
      $("rv-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const files = [...$("rv-files").files];
        const err = (m) => ($("rv-error").textContent = m);
        if (files.length > 3) return err("사진은 최대 3장까지 올릴 수 있습니다.");
        for (const f of files) {
          if (!["image/jpeg", "image/png", "image/webp"].includes(f.type)) return err("jpg/png/webp 파일만 올릴 수 있습니다.");
          if (f.size > 5 * 1024 * 1024) return err(`${f.name}: 5MB를 넘습니다.`);
        }
        $("rv-save").disabled = true;
        const ext = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };
        const paths = [];
        for (const f of files) {
          const path = `${Auth.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext[f.type]}`;
          const { error } = await sb.storage.from("review-images").upload(path, f, { contentType: f.type });
          if (error) { $("rv-save").disabled = false; return err(error.message); }
          paths.push(path);
        }
        const { error } = await sb.from("reviews").insert({
          product_id: reviewTarget.productId, user_id: Auth.user.id, order_item_id: reviewTarget.orderItemId,
          rating: Number($("rv-rating").value), body: $("rv-body").value.trim(), image_paths: paths,
        });
        $("rv-save").disabled = false;
        if (error) {
          if (paths.length) sb.storage.from("review-images").remove(paths);
          return err(error.code === "23505" ? "이미 후기를 작성한 상품입니다." : error.message);
        }
        dlg.close();
        toast("후기를 등록했어요.");
        renderOrders();
      });

      await Promise.all([renderOrders(), renderWish(), renderAddresses()]);
    });
  </script>
</body>
</html>
