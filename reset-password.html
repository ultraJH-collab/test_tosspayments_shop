<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호 재설정 | FITROOM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header id="site-header"></header>

  <main class="inner">
    <div class="auth">
      <form class="auth-form" id="form-reset" novalidate>
        <h2>새 비밀번호 설정</h2>
        <p class="muted" id="reset-note">메일의 링크를 통해 접속해야 비밀번호를 바꿀 수 있습니다.</p>
        <label><span>새 비밀번호 <small>(6자 이상)</small></span><input name="password" type="password" autocomplete="new-password" minlength="6" required /></label>
        <label>새 비밀번호 확인<input name="password2" type="password" autocomplete="new-password" required /></label>
        <p class="pay-error" data-error></p>
        <button type="submit" class="btn btn-black" id="btn-reset" disabled>비밀번호 변경</button>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script>
    onReady(() => {
      const form = document.getElementById("form-reset");
      const err = form.querySelector("[data-error]");
      const btn = document.getElementById("btn-reset");
      const enable = () => {
        btn.disabled = false;
        document.getElementById("reset-note").textContent = "새 비밀번호를 입력해 주세요.";
      };
      // 재설정 링크로 들어오면 PASSWORD_RECOVERY 이벤트로 임시 세션이 만들어진다.
      sb.auth.onAuthStateChange((event) => event === "PASSWORD_RECOVERY" && enable());
      if (/type=recovery/.test(location.hash)) enable();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        if (form.password.value.length < 6) return (err.textContent = "비밀번호는 6자 이상이어야 합니다.");
        if (form.password.value !== form.password2.value) return (err.textContent = "비밀번호가 일치하지 않습니다.");
        btn.disabled = true;
        const { error } = await sb.auth.updateUser({ password: form.password.value });
        if (error) {
          btn.disabled = false;
          return (err.textContent = error.message);
        }
        toast("비밀번호를 변경했어요. 다시 로그인해 주세요.");
        await sb.auth.signOut();
        setTimeout(() => (location.href = "login.html"), 1200);
      });
    });
  </script>
</body>
</html>
