<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 | FITROOM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="admin">
  <header id="site-header"></header>

  <main class="inner" id="admin-root">
    <h1 class="page-title">관리자</h1>
    <nav class="admin-tabs" id="admin-tabs">
      <button type="button" data-tab="products" class="on">상품 관리</button>
      <button type="button" data-tab="members">회원 관리</button>
      <button type="button" data-tab="orders">주문 관리</button>
    </nav>

    <!-- 상품 관리 -->
    <section class="admin-panel" id="tab-products">
      <div class="admin-toolbar">
        <input type="search" id="p-search" placeholder="상품명, 브랜드, ID 검색" />
        <select id="p-cat"><option value="">전체 카테고리</option></select>
        <select id="p-active">
          <option value="">전체 상태</option>
          <option value="1">판매중</option>
          <option value="0">숨김</option>
        </select>
        <span class="admin-count" id="p-count"></span>
        <button type="button" class="btn btn-black btn-sm" id="p-new">+ 상품 등록</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th></th><th>ID</th><th>카테고리</th><th>브랜드 / 상품명</th><th>정가</th><th>판매가</th><th>태그</th><th>상태</th><th>관리</th></tr></thead>
          <tbody id="p-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 회원 관리 -->
    <section class="admin-panel hidden" id="tab-members">
      <div class="admin-toolbar">
        <input type="search" id="m-search" placeholder="이메일, 이름, 휴대폰 검색" />
        <span class="admin-count" id="m-count"></span>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>이메일</th><th>이름</th><th>휴대폰</th><th>가입일</th><th>주문</th><th>등급</th><th>상태</th></tr></thead>
          <tbody id="m-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 주문 관리 -->
    <section class="admin-panel hidden" id="tab-orders">
      <div class="admin-toolbar">
        <input type="search" id="o-search" placeholder="주문번호, 주문자 검색" />
        <select id="o-status"><option value="">전체 상태</option></select>
        <span class="admin-count" id="o-count"></span>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>주문일시</th><th>주문번호</th><th>주문자</th><th>주문상품</th><th>결제금액</th><th>상태</th></tr></thead>
          <tbody id="o-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 상품 등록/수정 -->
  <dialog class="admin-dialog" id="p-dialog">
    <form method="dialog" id="p-form" novalidate>
      <div class="dlg-head"><h2 id="p-form-title">상품 등록</h2><button type="button" class="dlg-close" data-close aria-label="닫기">×</button></div>
      <div class="dlg-body">
        <div class="dlg-preview" id="p-preview"></div>
        <div class="form-grid">
          <label for="f-id">상품 ID</label><input id="f-id" name="id" placeholder="영문 소문자/숫자/-/_ (예: t09)" />
          <label for="f-cat">카테고리</label><select id="f-cat" name="cat"></select>
          <label for="f-brand">브랜드</label><input id="f-brand" name="brand" />
          <label for="f-name">상품명</label><input id="f-name" name="name" />
          <label for="f-price">정가</label><input id="f-price" name="price" type="number" min="0" step="100" />
          <label for="f-sale">판매가</label><input id="f-sale" name="sale" type="number" min="0" step="100" />
          <label for="f-sizes">사이즈</label><input id="f-sizes" name="sizes" placeholder="쉼표로 구분 (예: S, M, L)" />
          <label for="f-color">상품 색상</label><div class="inline"><input id="f-color" name="color" type="color" /><input id="f-tone" name="tone" type="color" title="배경 색상" /></div>
          <label for="f-tag">태그</label><select id="f-tag" name="tag"><option value="">없음</option><option>BEST</option><option>NEW</option></select>
          <label for="f-rating">평점 / 후기 / 좋아요</label>
          <div class="inline"><input id="f-rating" name="rating" type="number" min="0" max="5" step="0.1" aria-label="평점" /><input name="reviews" type="number" min="0" aria-label="후기 수" /><input name="likes" type="number" min="0" aria-label="좋아요 수" /></div>
          <label for="f-active">판매 상태</label><label class="check"><input id="f-active" name="is_active" type="checkbox" /> 판매중 (해제하면 매장에서 숨김)</label>
        </div>
      </div>
      <p class="pay-error" id="p-error"></p>
      <div class="dlg-foot">
        <button type="button" class="btn btn-line btn-sm" data-close>취소</button>
        <button type="submit" class="btn btn-black btn-sm" id="p-save">저장</button>
      </div>
    </form>
  </dialog>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
