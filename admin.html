<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 | FITROOM</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="admin">
  <header id="site-header"></header>

  <main class="inner" id="admin-root">
    <h1 class="page-title">관리자</h1>
    <nav class="admin-tabs" id="admin-tabs">
      <button type="button" data-tab="products" class="on">상품 관리</button>
      <button type="button" data-tab="members">회원 관리</button>
      <button type="button" data-tab="orders">주문 관리</button>
      <button type="button" data-tab="reviews">후기 관리</button>
      <button type="button" data-tab="qna">Q&amp;A</button>
      <button type="button" data-tab="coupons">쿠폰</button>
      <button type="button" data-tab="content">배너·공지·FAQ</button>
      <button type="button" data-tab="dashboard">매출 대시보드</button>
      <button type="button" data-tab="audit">감사 로그</button>
    </nav>

    <!-- Q&A -->
    <section class="admin-panel hidden" id="tab-qna">
      <div class="admin-toolbar">
        <input type="search" id="q-search" placeholder="상품 ID, 내용 검색" />
        <select id="q-state"><option value="">전체</option><option value="0">답변대기</option><option value="1">답변완료</option></select>
        <span class="admin-count" id="q-count"></span>
      </div>
      <div class="table-wrap"><table class="admin-table">
        <thead><tr><th>작성일</th><th>상품</th><th>작성자</th><th>문의</th><th>답변</th><th>관리</th></tr></thead>
        <tbody id="q-rows"></tbody></table></div>
    </section>

    <!-- 쿠폰 -->
    <section class="admin-panel hidden" id="tab-coupons">
      <form class="admin-toolbar" id="c-form">
        <input name="code" placeholder="코드 (영문대문자/숫자)" required style="width:170px" />
        <input name="name" placeholder="쿠폰명" required style="width:150px" />
        <select name="kind"><option value="amount">정액(원)</option><option value="percent">정률(%)</option></select>
        <input name="value" type="number" min="1" placeholder="할인값" required style="width:90px" />
        <input name="min_order" type="number" min="0" placeholder="최소주문" style="width:100px" />
        <input name="max_discount" type="number" min="1" placeholder="최대할인" style="width:100px" />
        <input name="total_limit" type="number" min="1" placeholder="총 한도" style="width:90px" />
        <input name="per_user_limit" type="number" min="1" placeholder="1인 한도(1)" style="width:100px" />
        <input name="starts_at" type="datetime-local" title="시작" style="width:190px" />
        <input name="ends_at" type="datetime-local" title="종료" style="width:190px" />
        <button type="submit" class="btn btn-black btn-sm">+ 쿠폰 등록</button>
      </form>
      <p class="pay-error" id="c-error"></p>
      <div class="table-wrap"><table class="admin-table">
        <thead><tr><th>코드</th><th>이름</th><th>혜택</th><th>조건</th><th>기간</th><th>사용</th><th>상태</th><th>관리</th></tr></thead>
        <tbody id="c-rows"></tbody></table></div>
    </section>

    <!-- 배너 / 공지 / FAQ -->
    <section class="admin-panel hidden" id="tab-content">
      <h3 class="admin-sub">메인 배너</h3>
      <form class="admin-toolbar" id="b-form">
        <input name="title" placeholder="제목(대체 텍스트)" style="width:170px" />
        <input name="image" type="file" accept="image/jpeg,image/png,image/webp" required style="width:220px" />
        <input name="link_url" placeholder="링크 (예: tops.html)" style="width:170px" />
        <input name="starts_at" type="datetime-local" title="노출 시작" style="width:190px" />
        <input name="ends_at" type="datetime-local" title="노출 종료" style="width:190px" />
        <button type="submit" class="btn btn-black btn-sm">+ 배너 등록</button>
      </form>
      <div class="table-wrap"><table class="admin-table"><thead><tr><th>이미지</th><th>제목</th><th>링크</th><th>기간</th><th>순서</th><th>상태</th><th>관리</th></tr></thead><tbody id="b-rows"></tbody></table></div>

      <h3 class="admin-sub">공지사항</h3>
      <form class="admin-toolbar" id="n-form">
        <input name="title" placeholder="제목" required style="width:240px" />
        <input name="body" placeholder="내용" style="width:360px" />
        <label class="check"><input name="is_pinned" type="checkbox" /> 상단 고정</label>
        <button type="submit" class="btn btn-black btn-sm">+ 공지 등록</button>
      </form>
      <div class="table-wrap"><table class="admin-table"><thead><tr><th>작성일</th><th>제목</th><th>내용</th><th>고정</th><th>관리</th></tr></thead><tbody id="n-rows"></tbody></table></div>

      <h3 class="admin-sub">FAQ</h3>
      <form class="admin-toolbar" id="f-form">
        <input name="question" placeholder="질문" required style="width:280px" />
        <input name="answer" placeholder="답변" style="width:340px" />
        <input name="sort_order" type="number" placeholder="순서" style="width:80px" />
        <button type="submit" class="btn btn-black btn-sm">+ FAQ 등록</button>
      </form>
      <div class="table-wrap"><table class="admin-table"><thead><tr><th>순서</th><th>질문</th><th>답변</th><th>관리</th></tr></thead><tbody id="f-rows"></tbody></table></div>
    </section>

    <!-- 매출 대시보드 -->
    <section class="admin-panel hidden" id="tab-dashboard">
      <div class="admin-toolbar">
        <input type="date" id="d-from" style="width:160px" /> ~ <input type="date" id="d-to" style="width:160px" />
        <select id="d-unit"><option value="day">일별</option><option value="week">주별</option><option value="month">월별</option></select>
        <button type="button" class="btn btn-black btn-sm" id="d-run">조회</button>
      </div>
      <p class="pay-error" id="d-error"></p>
      <div id="d-body"></div>
    </section>

    <!-- 감사 로그 -->
    <section class="admin-panel hidden" id="tab-audit">
      <div class="admin-toolbar">
        <select id="a-table"><option value="">전체 대상</option><option>products</option><option>product_stock</option><option>orders</option><option>profiles</option><option>coupons</option></select>
        <span class="admin-count" id="a-count"></span>
      </div>
      <div class="table-wrap"><table class="admin-table">
        <thead><tr><th>일시</th><th>대상</th><th>ID</th><th>동작</th><th>수행자</th><th>변경 내용</th></tr></thead>
        <tbody id="a-rows"></tbody></table></div>
    </section>

    <!-- 후기 관리 -->
    <section class="admin-panel hidden" id="tab-reviews">
      <div class="admin-toolbar">
        <input type="search" id="r-search" placeholder="상품 ID, 내용 검색" />
        <select id="r-hidden"><option value="">전체</option><option value="1">숨김</option><option value="0">노출</option></select>
        <span class="admin-count" id="r-count"></span>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>작성일</th><th>상품</th><th>작성자</th><th>별점</th><th>내용</th><th>관리</th></tr></thead>
          <tbody id="r-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 상품 관리 -->
    <section class="admin-panel" id="tab-products">
      <div class="admin-toolbar">
        <input type="search" id="p-search" placeholder="상품명, 브랜드, ID 검색" />
        <select id="p-cat"><option value="">전체 카테고리</option></select>
        <select id="p-active">
          <option value="">전체 상태</option>
          <option value="1">판매중</option>
          <option value="0">숨김</option>
        </select>
        <span class="admin-count" id="p-count"></span>
        <button type="button" class="btn btn-line btn-sm" id="p-csv">CSV</button>
        <button type="button" class="btn btn-black btn-sm" id="p-new">+ 상품 등록</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th></th><th>ID</th><th>카테고리</th><th>브랜드 / 상품명</th><th>정가</th><th>판매가</th><th>태그</th><th>상태</th><th>관리</th></tr></thead>
          <tbody id="p-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 회원 관리 -->
    <section class="admin-panel hidden" id="tab-members">
      <div class="admin-toolbar">
        <input type="search" id="m-search" placeholder="이메일, 이름, 휴대폰 검색" />
        <span class="admin-count" id="m-count"></span>
        <button type="button" class="btn btn-line btn-sm" id="m-csv">CSV</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>이메일</th><th>이름</th><th>휴대폰</th><th>가입일</th><th>주문</th><th>등급</th><th>상태</th></tr></thead>
          <tbody id="m-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 주문 관리 -->
    <section class="admin-panel hidden" id="tab-orders">
      <div class="admin-toolbar">
        <input type="search" id="o-search" placeholder="주문번호, 주문자 검색" />
        <select id="o-status"><option value="">전체 상태</option></select>
        <span class="admin-count" id="o-count"></span>
        <button type="button" class="btn btn-line btn-sm" id="o-bulk">선택 주문 일괄 다음 단계</button>
        <button type="button" class="btn btn-line btn-sm" id="o-csv">CSV</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th><input type="checkbox" id="o-all" aria-label="전체 선택" /></th><th>주문일시</th><th>주문번호</th><th>주문자</th><th>주문상품</th><th>결제금액</th><th>상태</th></tr></thead>
          <tbody id="o-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 상품 등록/수정 -->
  <dialog class="admin-dialog" id="p-dialog">
    <form method="dialog" id="p-form" novalidate>
      <div class="dlg-head"><h2 id="p-form-title">상품 등록</h2><button type="button" class="dlg-close" data-close aria-label="닫기">×</button></div>
      <div class="dlg-body">
        <div class="dlg-preview" id="p-preview"></div>
        <div class="form-grid">
          <label for="f-id">상품 ID</label><input id="f-id" name="id" placeholder="영문 소문자/숫자/-/_ (예: t09)" />
          <label for="f-cat">카테고리</label><select id="f-cat" name="cat"></select>
          <label for="f-brand">브랜드</label><input id="f-brand" name="brand" />
          <label for="f-name">상품명</label><input id="f-name" name="name" />
          <label for="f-price">정가</label><input id="f-price" name="price" type="number" min="0" step="100" />
          <label for="f-sale">판매가</label><input id="f-sale" name="sale" type="number" min="0" step="100" />
          <label for="f-sizes">사이즈</label><input id="f-sizes" name="sizes" placeholder="쉼표로 구분 (예: S, M, L)" />
          <label>상품 이미지</label>
          <div>
            <div class="img-mgr" id="f-images"></div>
            <input type="file" id="f-image-files" accept="image/jpeg,image/png,image/webp" multiple />
            <p class="muted" style="margin:4px 0 0">jpg/png/webp, 파일당 5MB 이하. 첫 번째가 대표 이미지입니다. 없으면 일러스트가 표시됩니다.</p>
          </div>
          <label>사이즈별 재고</label><div class="inline" id="f-stock" style="flex-wrap:wrap"></div>
          <label for="f-color">상품 색상</label><div class="inline"><input id="f-color" name="color" type="color" /><input id="f-tone" name="tone" type="color" title="배경 색상" /></div>
          <label for="f-tag">태그</label><select id="f-tag" name="tag"><option value="">없음</option><option>BEST</option><option>NEW</option></select>
          <label for="f-rating">평점 / 후기 / 좋아요</label>
          <div class="inline"><input id="f-rating" name="rating" type="number" min="0" max="5" step="0.1" aria-label="평점" /><input name="reviews" type="number" min="0" aria-label="후기 수" /><input name="likes" type="number" min="0" aria-label="좋아요 수" /></div>
          <label for="f-active">판매 상태</label><label class="check"><input id="f-active" name="is_active" type="checkbox" /> 판매중 (해제하면 매장에서 숨김)</label>
        </div>
      </div>
      <p class="pay-error" id="p-error"></p>
      <div class="dlg-foot">
        <button type="button" class="btn btn-line btn-sm" data-close>취소</button>
        <button type="submit" class="btn btn-black btn-sm" id="p-save">저장</button>
      </div>
    </form>
  </dialog>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/seo.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
